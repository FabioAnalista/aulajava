<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Verificador de Números Primos</title>
</head>
<body>
    <h2>Verificador de Primos</h2>
    <label for="numero">Digite um número:</label>
    <input type="number" id="numero" min="1">
    <button onclick="verificarPrimo()">Verificar</button>

    <p id="resultado"></p>

    <script>
        function verificarPrimo() {
            const num = parseInt(document.getElementById('numero').value);
            const pResultado = document.getElementById('resultado');

            if (isNaN(num) || num <= 1) {
                pResultado.textContent = "Por favor, digite um número inteiro maior que 1.";
                return;
            }

            let divisores = 0;

            // Loop para encontrar divisores
            for (let i = 1; i <= num; i++) {
                if (num % i === 0) {
                    divisores++;
                }
            }

            // Um número primo possui exatamente 2 divisores (1 e ele mesmo)
            if (divisores === 2) {
                pResultado.textContent = `${num} É um número PRIMO!`;
            } else {
                pResultado.textContent = `${num} NÃO é um número primo (possui outros divisores além de 1 e ele mesmo).`;
            }
        }
    </script>
</body>
</html>
