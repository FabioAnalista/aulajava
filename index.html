<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exibir Números Pares</title>
</head>
<body>
    <h2>Gerador de Números Pares</h2>
    <label for="numero">Digite um número:</label>
    <input type="number" id="numero" min="1">
    <button onclick="mostrarPares()">Exibir Pares</button>

    <h3>Resultado:</h3>
    <p id="resultado"></p>

    <script>
        function mostrarPares() {
            let limite = parseInt(document.getElementById("numero").value);
            let pares = [];

            if (isNaN(limite) || limite < 1) {
                alert("Por favor, digite um número maior ou igual a 1.");
                return;
            }

            for (let i = 1; i <= limite; i++) {
                if (i % 2 === 0) {
                    pares.push(i);
                }
            }

            document.getElementById("resultado").innerText = pares.join(", ");
        }
    </script>
</body>
</html>
